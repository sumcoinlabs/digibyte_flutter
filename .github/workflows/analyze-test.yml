name: Analyze & Test
on:
  push:
    branches:
      - master
      - fix/firebase-security-0.1.5
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  code-analysis-and-unit-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.8'
        channel: 'stable'
        cache: true
    - run: flutter pub get
    - name: Build DigiCoinLib secp256k1 for unit tests
      run: |
        brew install autoconf automake libtool
        dart run digicoinlib:build_macos
        test -s build/libsecp256k1.dylib
    - name: Prepare CI-only Firebase configuration
      run: cp .github/ci/firebase_options.ci-template lib/firebase_options.dart
    - run: flutter analyze --no-fatal-warnings --no-fatal-infos
    - run: flutter test -r expanded

  android-device-smoke:
    name: Android 16 device smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare nonproduction Firebase configuration
        run: |
          cp .github/ci/firebase_options.ci-template lib/firebase_options.dart
          cp .github/ci/google-services.ci-template.json android/app/google-services.json

      - name: Run DigiByte Android device smoke test
        uses: ReactiveCircus/android-emulator-runner@v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          script: |
            flutter pub get
            flutter test integration_test/digibyte_device_smoke_test.dart -d emulator-5554 -r expanded
